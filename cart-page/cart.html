<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="cart-page.css">

    <title>My Cart</title>
</head>

<body>

    <header>
        <div class="shipping-offer">Free U.S. shipping on orders over $150</div>
        <nav role="navigation">
            <div class="nav-child">
                <a href="../home/index.html" class="logo">Not Strangers</a>
                <a href="../shop/shop.html">Shop</a>
                <a href="../learn/learn.html">Learn</a>
                <a href="../about/about.html">About</a>
            </div>

            <div class="nav-child" id="mobile-menu-nav">
                <div id="cart-icon">
                    <i class="ri-shopping-bag-line icon"></i>
                    <span class="cart-item-count"></span>
                </div>
                <i class="ri-menu-line" id="burger-menu-icon" title="button to open mobile navigation"
                    onclick="openMobileNav()"></i>
            </div>
        </nav>
    </header>

    <div class="mobile-menu">
        <i class="ri-close-line mobile-menu-close" onclick="closeMobileNav()"></i>
        <div class="mobile-menu-links">
            <a href="../home/index.html">Home</a>
            <a href="../shop/shop.html">Shop</a>
            <a href="../learn/learn.html">Learn</a>
            <a href="../about/about.html">About</a>
        </div>
    </div>

    <div class="shoppingCart" id="shoppingCart">
        <h2 class="cart-title">Your Cart</h2>
        <div class="cart-contents"></div>
        <div class="total">
            <p class="total-title">Total</p>
            <p class="dollar-sign-p">$<span class="total-price"></span></p>
        </div>
        <button class="cart-checkout-btn">Checkout</button>
        <i class="ri-close-line" id="cart-close"></i>
    </div>

    <main>
        <div class="preview">
            <h1 class="preview-h1">Shopping Cart</h1>
            <div class="cart">
                <hr>
                <p class="numItems">0 items</p>
                <ul class="cart-items" id="cart-list">

                </ul>
                <hr>
                <div class="cart-footer">
                    <h4 class="total-title">Total</h4>
                    <p class="total" id="cart-total">$0</p>
                </div>
                <button class="cart-btn">Buy Now</button>
            </div>


            <!-- <div id="cart-modal" class="modal">
            <div class="modal-content">
                <span><i class='bx  bx-x'></i></span>
                <h2>Shopping Cart</h2>
                <ul id="cart-list"></ul>
                <h5 id="cart-total"></h5>
            </div>
        </div> -->
        </div>
    </main>



    <footer class="footer">
        
        <!-- <div>
            <i class='bx bxl-instagram bx-sm social-icon' ></i> 
            <i class='bx bxs-castle bx-sm social-icon' ></i> 
            <i class='bx bxl-facebook-circle bx-sm social-icon' ></i>
            <i class='bx bxl-tiktok bx-sm social-icon'></i>
        </div> -->
        
    </footer>





    <script src="../script3.js"></script>
</body>

</html>
